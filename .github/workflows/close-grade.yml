name: Close & Grade (Signal Desk)

on:
  workflow_dispatch:
    inputs:
      live:
        description: "Write to Airtable (true) or dry run (false)"
        type: boolean
        default: false
  pull_request:
    paths:
      - signal-desk/close_grade.py
      - signal-desk/markets.py
      - signal-desk/espn_sync.py
      - signal-desk/producer_health.py
      - .github/workflows/close-grade.yml
  schedule:
    - cron: "37 * * * *"

permissions:
  contents: write   # data-only commit of graded market picks

concurrency:
  group: signal-desk-close-grade
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    env:
      AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
      AIRTABLE_BASE_ID: ${{ secrets.SIGNAL_DESK_BASE_ID || secrets.AIRTABLE_BASE_ID }}
      WEBSCRAPING_AI_API_KEY: ${{ secrets.WEBSCRAPING_AI_API_KEY }}
      MARKETS_LIVE: ${{ ((github.event_name == 'workflow_dispatch' && inputs.live == true) || (github.event_name == 'schedule' && vars.MARKETS_LIVE == 'true')) && '1' || '0' }}
      CLOSE_GRADE_LIVE: ${{ ((github.event_name == 'workflow_dispatch' && inputs.live == true) || (github.event_name == 'schedule' && vars.CLOSE_GRADE_LIVE == 'true')) && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate configuration
        shell: bash
        run: |
          missing=()
          for key in AIRTABLE_TOKEN AIRTABLE_BASE_ID WEBSCRAPING_AI_API_KEY; do
            if [ -z "${!key}" ]; then
              missing+=("$key")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing or empty GitHub Actions secret(s): ${missing[*]}"
            exit 1
          fi
          echo "Configuration present. Mode: CLOSE_GRADE_LIVE=${CLOSE_GRADE_LIVE}"
      - name: Capture closing lines and grade finished games
        run: python signal-desk/close_grade.py
      - name: Grade every market (spread, total, moneyline, teaser legs, teasers, parlay legs, parlays)
        run: python signal-desk/markets.py grade
      - name: Repair market CLV on graded spread and total rows (idempotent, close and CLV only)
        run: python signal-desk/markets.py reclv --write
      - name: Commit graded market picks (data only)
        if: ${{ env.MARKETS_LIVE == '1' }}
        run: bash .github/scripts/commit_data.sh "Signal Desk market grades $(date -u +%F-%H%M) (auto)" signal-desk/intelligence/markets/picks_log.csv
      - name: Preserve grading coverage diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: close-grade-health
          path: signal-desk/data/producer_health/close_grade.json
          if-no-files-found: warn
