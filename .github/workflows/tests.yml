name: Signal Desk unit tests

on:
  pull_request:
    paths: ["signal-desk/**", ".github/workflows/tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        working-directory: signal-desk
        run: python -m unittest discover -s tests -v
