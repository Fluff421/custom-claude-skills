name: Splash picks vs model (Signal Desk)

# Manual only. Paste the owner's Splash picks at the LOCKED line (one per line, or separated by semicolons):
#   spreads  Alabama -7.5; Ohio State +3; Kansas State PK
#   totals   Baltimore at Buffalo Over 45.5
#   moneyline  Buffalo ML -180
#   Teaser: Alabama -1.5, Over 45.5 Baltimore at Buffalo      (base locked lines; add "teased" to a leg to paste the teased number)
#   Parlay: Alabama -7.5, Buffalo ML -180, Under 50 Auburn at LSU
#   Other: Alabama alt -3.5 at +150
# The pasted line is the official locked line. The ledger holds the early-week import; the gap is line movement.
# Games already started or finished are still logged and graded. Read-only against Airtable.
on:
  workflow_dispatch:
    inputs:
      picks:
        description: "Splash picks at the locked line, one per line or separated by semicolons (see file header for every format)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: signal-desk-splash-compare
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    env:
      AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
      AIRTABLE_BASE_ID: ${{ secrets.SIGNAL_DESK_BASE_ID || secrets.AIRTABLE_BASE_ID }}
      FACTOR_MODE: ${{ vars.FACTOR_MODE || 'shadow' }}
      SPLASH_PICKS: ${{ inputs.picks }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compare
        run: python signal-desk/splash_compare.py
      - name: Commit the comparison and log
        shell: bash
        run: |
          bash .github/scripts/commit_data.sh "Splash picks vs model $(date -u +%F-%H%M) (auto)" signal-desk/intelligence/splash_picks signal-desk/intelligence/splash_picks_log.csv
