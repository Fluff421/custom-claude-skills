name: Splash picks vs model (Signal Desk)

# Manual only. Paste the user's Splash picks (one per line, or separated by semicolons), e.g.
#   Alabama -7.5; Ohio State +3; Kansas State PK
# Compares them with the model's suggestions and logs the comparison in the repo.
# Read-only against Airtable: it never writes Splash fields or results.
on:
  workflow_dispatch:
    inputs:
      picks:
        description: "Splash picks, one per line or separated by semicolons: Team -3.5"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: signal-desk-splash-compare
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    env:
      AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
      AIRTABLE_BASE_ID: ${{ secrets.SIGNAL_DESK_BASE_ID || secrets.AIRTABLE_BASE_ID }}
      SPLASH_PICKS: ${{ inputs.picks }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compare
        run: python signal-desk/splash_compare.py
      - name: Commit the comparison and log
        shell: bash
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "signal-desk-bot@users.noreply.github.com"
          git add signal-desk/intelligence/splash_picks signal-desk/intelligence/splash_picks_log.csv
          if git diff --cached --quiet; then echo "Nothing to commit."; exit 0; fi
          git commit -m "Splash picks vs model $(date -u +%F-%H%M) (auto)"
          git pull --rebase -q origin main
          git push
