name: Snapshot (Signal Desk)

on:
  workflow_dispatch:
    inputs:
      live:
        description: "Commit the regenerated files to main (true) or dry run (false)"
        type: boolean
        default: false
  pull_request:
    paths:
      - signal-desk/snapshot.py
      - signal-desk/ops_export.py
      - signal-desk/intelligence_report.py
      - signal-desk/markets.py
      - signal-desk/validate_artifacts.py
      - signal-desk/producer_health.py
      - .github/workflows/snapshot.yml
      - .github/workflows/signal-desk-ci.yml
  schedule:
    # 7:47 AM Central, leaving 43 minutes before the 8:30 briefing.
    # Offset-based selection still admits delayed starts; readiness is checked separately.
    # Runs after close-grade's 7:37 tick so overnight grades are included.
    - cron: "47 12 * * *"
    - cron: "47 13 * * *"
  # Also run as soon as the morning Context & Calibrate run finishes, so a delayed or dropped
  # GitHub cron tick does not leave the briefing without today's report.
  workflow_run:
    workflows: ["Context & Calibrate (Signal Desk)"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('signal-desk-snapshot-pr-{0}', github.event.pull_request.number) || 'signal-desk-snapshot' }}
  cancel-in-progress: false

jobs:
  pull_request_checks:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/signal-desk-ci.yml
  snapshot:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      AIRTABLE_BASE_ID: ${{ secrets.SIGNAL_DESK_BASE_ID || secrets.AIRTABLE_BASE_ID }}
      FACTOR_MODE: ${{ vars.FACTOR_MODE || 'shadow' }}
      SNAPSHOT_LIVE: ${{ ((github.event_name == 'workflow_dispatch' && inputs.live == true) || ((github.event_name == 'schedule' || github.event_name == 'workflow_run') && vars.SNAPSHOT_LIVE == 'true')) && '1' || '0' }}
    steps:
      - name: Time gate (7:47 AM Central for scheduled runs)
        id: gate
        shell: bash
        env:
          FIRED: ${{ github.event.schedule }}
          UPSTREAM_RUN: ${{ github.event.workflow_run.id }}
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
          UPSTREAM_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pick the cron slot by today's Central offset, not the wall clock,
          # so a late-starting GitHub run is not skipped.
          offset=$(TZ=America/Chicago date +%z)
          if [ "$offset" = "-0500" ]; then want="47 12 * * *"; else want="47 13 * * *"; fi
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            # Follow only a main-repo scheduled or manual Context run whose context job really ran
            # (the off-slot daylight-saving tick skips it). Success is not required: the report
            # must still be rebuilt, and readiness reports the failed producer separately.
            ctx=""
            if [ "$UPSTREAM_REPO" = "${{ github.repository }}" ] && { [ "$UPSTREAM_EVENT" = "schedule" ] || [ "$UPSTREAM_EVENT" = "workflow_dispatch" ]; }; then
              ctx=$(gh api "repos/${{ github.repository }}/actions/runs/$UPSTREAM_RUN/jobs" --jq '[.jobs[] | select(.name == "context") | .conclusion][0] // ""')
            fi
            if [ -n "$ctx" ] && [ "$ctx" != "skipped" ] && [ "$ctx" != "null" ]; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Skipping: upstream Context run $UPSTREAM_RUN did not run its context job ($ctx)."
            fi
          elif [ "${{ github.event_name }}" != "schedule" ] || [ "$FIRED" = "$want" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: slot '$FIRED' is not 7:47 AM Central today (offset $offset)."
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
        with:
          # A queued run must start from the newest main, not the commit that triggered it,
          # so overlapping producers do not rebase stale generated files over each other.
          ref: ${{ github.event_name != 'pull_request' && 'main' || '' }}
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.11"
      - name: Validate configuration
        id: config
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          missing=()
          for key in AIRTABLE_TOKEN AIRTABLE_BASE_ID; do
            if [ -z "${!key}" ]; then
              missing+=("$key")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing or empty GitHub Actions secret(s): ${missing[*]}"
            exit 1
          fi
          echo "Configuration present. Mode: SNAPSHOT_LIVE=${SNAPSHOT_LIVE}"
      - name: Regenerate LEDGER.md and snapshot.json from Airtable
        if: steps.gate.outputs.run == 'true'
        run: python signal-desk/snapshot.py
      - name: Export graded picks and ops health (reads Airtable and Actions logs)
        if: steps.gate.outputs.run == 'true'
        run: python signal-desk/ops_export.py
      - name: Capture lines and prices for every market (timestamped line log) and price every bet
        if: steps.gate.outputs.run == 'true'
        run: python signal-desk/markets.py run
      - name: Build the daily intelligence report (read-only; picks, results, learning state)
        if: steps.gate.outputs.run == 'true'
        run: python signal-desk/intelligence_report.py
      - name: Validate briefing readiness (failure remains visible)
        if: ${{ !cancelled() && steps.gate.outputs.run == 'true' && steps.config.outcome == 'success' }}
        run: python signal-desk/validate_artifacts.py --output signal-desk/data/artifact_validation.json
      - name: Preserve readiness diagnostics
        if: ${{ !cancelled() && steps.gate.outputs.run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: signal-desk-readiness
          path: signal-desk/data/artifact_validation.json
          if-no-files-found: warn
      - name: Commit snapshot
        # Publish diagnostics and any valid outputs even if readiness failed; never mask the red job.
        if: ${{ !cancelled() && steps.gate.outputs.run == 'true' && steps.config.outcome == 'success' && env.SNAPSHOT_LIVE == '1' }}
        shell: bash
        run: |
          bash .github/scripts/commit_data.sh "Signal Desk snapshot $(date -u +%F) (auto, readiness checked)" \
            signal-desk/LEDGER.md signal-desk/data signal-desk/intelligence
