name: Snapshot (Signal Desk)

on:
  workflow_dispatch:
    inputs:
      live:
        description: "Commit the regenerated files to main (true) or dry run (false)"
        type: boolean
        default: false
  pull_request:
    paths:
      - signal-desk/snapshot.py
      - signal-desk/ops_export.py
      - .github/workflows/snapshot.yml
  schedule:
    # 8:17 AM America/Chicago year-round. GitHub cron is UTC only, so both
    # candidates are scheduled (13:17 UTC = 8:17 CDT, 14:17 UTC = 8:17 CST) and
    # the "Time gate" step lets only the one that lands at 8 AM Central proceed.
    # Runs after close-grade's 7:37 tick so overnight grades are included.
    - cron: "17 13 * * *"
    - cron: "17 14 * * *"

permissions:
  contents: write
  actions: read

concurrency:
  group: signal-desk-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      AIRTABLE_BASE_ID: ${{ secrets.SIGNAL_DESK_BASE_ID || secrets.AIRTABLE_BASE_ID }}
      SNAPSHOT_LIVE: ${{ ((github.event_name == 'workflow_dispatch' && inputs.live == true) || (github.event_name == 'schedule' && vars.SNAPSHOT_LIVE == 'true')) && '1' || '0' }}
    steps:
      - name: Time gate (8:17 AM Central for scheduled runs)
        id: gate
        shell: bash
        env:
          FIRED: ${{ github.event.schedule }}
        run: |
          # Pick the cron slot by today's Central offset, not the wall clock,
          # so a late-starting GitHub run is not skipped.
          offset=$(TZ=America/Chicago date +%z)
          if [ "$offset" = "-0500" ]; then want="17 13 * * *"; else want="17 14 * * *"; fi
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$FIRED" = "$want" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: slot '$FIRED' is not 8:17 AM Central today (offset $offset)."
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.11"
      - name: Validate configuration
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          missing=()
          for key in AIRTABLE_TOKEN AIRTABLE_BASE_ID; do
            if [ -z "${!key}" ]; then
              missing+=("$key")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing or empty GitHub Actions secret(s): ${missing[*]}"
            exit 1
          fi
          echo "Configuration present. Mode: SNAPSHOT_LIVE=${SNAPSHOT_LIVE}"
      - name: Regenerate LEDGER.md and snapshot.json from Airtable
        if: steps.gate.outputs.run == 'true'
        run: python signal-desk/snapshot.py
      - name: Export graded picks and ops health (reads Airtable and Actions logs)
        if: steps.gate.outputs.run == 'true'
        run: python signal-desk/ops_export.py
      - name: Commit snapshot
        if: ${{ steps.gate.outputs.run == 'true' && env.SNAPSHOT_LIVE == '1' }}
        shell: bash
        run: |
          FILES="signal-desk/LEDGER.md signal-desk/data/snapshot.json signal-desk/data/graded_picks.csv signal-desk/data/ops_status.json"
          git add -N $FILES 2>/dev/null || true
          if git diff --quiet -- $FILES; then
            echo "No change to commit."
            exit 0
          fi
          git config user.name "signal-desk-bot"
          git config user.email "signal-desk-bot@users.noreply.github.com"
          git add $FILES
          git commit -m "Signal Desk snapshot $(date -u +%F) (auto, from Airtable)"
          git push
