name: Context & Calibrate (Signal Desk)

on:
  workflow_dispatch:
    inputs:
      live:
        description: "Write to Airtable (true) or dry run (false)"
        type: boolean
        default: false
  pull_request:
    paths:
      - signal-desk/context_sync.py
      - signal-desk/calibrate.py
      - signal-desk/sigma_learning.py
      - signal-desk/clv_learning.py
      - signal-desk/market_learning.py
      - signal-desk/learning_events.py
      - .github/workflows/context-calibrate.yml
  schedule:
    # 6:13 AM Central, before grading, Snapshot and briefing evaluation.
    - cron: "13 11 * * *"
    - cron: "13 12 * * *"

permissions:
  contents: read

jobs:
  time_gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - id: gate
        env:
          FIRED: ${{ github.event.schedule }}
          EVENT: ${{ github.event_name }}
        run: |
          offset=$(TZ=America/Chicago date +%z)
          if [ "$offset" = "-0500" ]; then want="13 11 * * *"; else want="13 12 * * *"; fi
          if [ "$EVENT" != "schedule" ] || [ "$FIRED" = "$want" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
  context:
    needs: time_gate
    if: needs.time_gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
      AIRTABLE_BASE_ID: ${{ secrets.SIGNAL_DESK_BASE_ID || secrets.AIRTABLE_BASE_ID }}
      WEBSCRAPING_AI_API_KEY: ${{ secrets.WEBSCRAPING_AI_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      SCORING_DETAIL_LIVE: ${{ vars.SCORING_DETAIL_LIVE }}
      CONTEXT_SYNC_LIVE: ${{ ((github.event_name == 'workflow_dispatch' && inputs.live == true) || (github.event_name == 'schedule' && vars.CONTEXT_SYNC_LIVE == 'true')) && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate configuration
        shell: bash
        run: |
          missing=()
          for key in AIRTABLE_TOKEN AIRTABLE_BASE_ID WEBSCRAPING_AI_API_KEY; do
            if [ -z "${!key}" ]; then
              missing+=("$key")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing or empty GitHub Actions secret(s): ${missing[*]}"
            exit 1
          fi
          echo "Configuration present. Mode: CONTEXT_SYNC_LIVE=${CONTEXT_SYNC_LIVE}"
      - name: Sync momentum and look-ahead context
        run: python signal-desk/context_sync.py

  calibrate:
    runs-on: ubuntu-latest
    needs: context
    permissions:
      contents: write   # data-only commit of the change log and per-market settings
    env:
      MARKET_LEARN_LIVE: ${{ ((github.event_name == 'workflow_dispatch' && inputs.live == true) || (github.event_name == 'schedule' && vars.MARKET_LEARN_LIVE == 'true')) && '1' || '0' }}
      AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
      AIRTABLE_BASE_ID: ${{ secrets.SIGNAL_DESK_BASE_ID || secrets.AIRTABLE_BASE_ID }}
      CALIBRATE_LIVE: ${{ ((github.event_name == 'workflow_dispatch' && inputs.live == true) || (github.event_name == 'schedule' && vars.CALIBRATE_LIVE == 'true')) && '1' || '0' }}
      FACTORS_LEARN_LIVE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && vars.FACTORS_LEARN_LIVE == 'true' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate configuration
        shell: bash
        run: |
          missing=()
          for key in AIRTABLE_TOKEN AIRTABLE_BASE_ID; do
            if [ -z "${!key}" ]; then
              missing+=("$key")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing or empty GitHub Actions secret(s): ${missing[*]}"
            exit 1
          fi
          echo "Configuration present. Mode: CALIBRATE_LIVE=${CALIBRATE_LIVE}"
      - name: Recalibrate model parameters
        run: python signal-desk/calibrate.py
      - name: Learn per market (totals, moneylines, teaser legs); dry run unless MARKET_LEARN_LIVE
        run: |
          if [ "$MARKET_LEARN_LIVE" = "1" ]; then python signal-desk/market_learning.py --live; else python signal-desk/market_learning.py; fi
      - name: Commit change log, market settings and scorecards (data only)
        if: ${{ env.MARKET_LEARN_LIVE == '1' || env.CALIBRATE_LIVE == '1' }}
        run: bash .github/scripts/commit_data.sh "Signal Desk learning $(date -u +%F) (auto)" signal-desk/intelligence/learning_log.csv signal-desk/intelligence/learning_params.json signal-desk/intelligence/market_params.json signal-desk/intelligence/markets/scorecards.json
