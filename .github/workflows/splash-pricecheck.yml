name: Splash pick-time check (Signal Desk)

# Manual, and automatically after each live Snapshot run so the morning check is never older than the report. Reprices every upcoming game at the newest Splash line in intelligence/splash_lines_log.csv
# (spread, total, moneyline and 6-point teaser legs) and shows what changed versus the early-week import.
# Run it right before picking on Splash. Read-only against Airtable; paper picks only.
on:
  workflow_dispatch:
    inputs:
      games:
        description: "Optional: comma-separated team names to limit the check (blank = all upcoming games)"
        required: false
        default: ""
        type: string
  workflow_run:
    workflows: ["Snapshot (Signal Desk)"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: signal-desk-splash-pricecheck
  cancel-in-progress: false

jobs:
  check:
    # After Snapshot, run only for main-repo scheduled/chained runs; this never changes the
    # underlying Splash quote age, which readiness still checks against the 12-hour board limit.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.head_repository.full_name == github.repository &&
           github.event.workflow_run.head_branch == 'main' &&
           (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_run')) }}
    runs-on: ubuntu-latest
    env:
      AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
      AIRTABLE_BASE_ID: ${{ secrets.SIGNAL_DESK_BASE_ID || secrets.AIRTABLE_BASE_ID }}
      FACTOR_MODE: ${{ vars.FACTOR_MODE || 'shadow' }}
      SPLASH_CHECK_GAMES: ${{ inputs.games }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A queued run must start from the newest main, not the commit that triggered it,
          # so overlapping producers do not rebase stale generated files over each other.
          ref: ${{ github.event_name != 'pull_request' && 'main' || '' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pick-time check
        run: python signal-desk/splash_pricecheck.py
      - name: Commit the check
        shell: bash
        run: |
          bash .github/scripts/commit_data.sh "Splash pick-time check $(date -u +%F-%H%M) (auto)" signal-desk/intelligence/splash_pricecheck
