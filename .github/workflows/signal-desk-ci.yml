name: Signal Desk offline contracts

on:
  workflow_call:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run deterministic producer, parser and readiness contracts
        working-directory: signal-desk
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q signal-desk
