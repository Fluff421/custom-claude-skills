name: ESPN Sync (Signal Desk)

on:
  workflow_dispatch:
    inputs:
      live:
        description: "Write to Airtable (true) or dry run (false)"
        type: boolean
        default: false
  pull_request:
    paths:
      - signal-desk/espn_sync.py
      - signal-desk/producer_health.py
      - .github/workflows/espn-sync.yml
      - .github/workflows/signal-desk-ci.yml
  schedule:
    - cron: "27 */3 * * *"

permissions:
  contents: write   # observation heartbeat only; no new Airtable fields

jobs:
  pull_request_checks:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/signal-desk-ci.yml
  sync:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
      AIRTABLE_BASE_ID: ${{ secrets.SIGNAL_DESK_BASE_ID || secrets.AIRTABLE_BASE_ID }}
      LEDGER_TABLE_ID: ${{ vars.LEDGER_TABLE_ID }}
      WEBSCRAPING_AI_API_KEY: ${{ secrets.WEBSCRAPING_AI_API_KEY }}
      ESPN_SYNC_LIVE: ${{ ((github.event_name == 'workflow_dispatch' && inputs.live == true) || (github.event_name == 'schedule' && vars.ESPN_SYNC_LIVE == 'true')) && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A queued run must start from the newest main, not the commit that triggered it,
          # so overlapping producers do not rebase stale generated files over each other.
          ref: ${{ github.event_name != 'pull_request' && 'main' || '' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate configuration
        shell: bash
        run: |
          missing=()
          for key in AIRTABLE_TOKEN AIRTABLE_BASE_ID WEBSCRAPING_AI_API_KEY; do
            if [ -z "${!key}" ]; then
              missing+=("$key")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing or empty GitHub Actions secret(s): ${missing[*]}"
            exit 1
          fi
          echo "Configuration present. Mode: ESPN_SYNC_LIVE=${ESPN_SYNC_LIVE}"
          echo "Base ID secret resolved: ${AIRTABLE_BASE_ID:+present}"
      - name: Sync ESPN data into the Signal Desk Ledger
        run: python signal-desk/espn_sync.py
      - name: Commit observation heartbeat
        if: ${{ env.ESPN_SYNC_LIVE == '1' }}
        run: bash .github/scripts/commit_data.sh "Signal Desk ESPN checked $(date -u +%F-%H%M)" signal-desk/data/source_heartbeats.json
      - name: Preserve observation heartbeat
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: espn-observation-heartbeat
          path: signal-desk/data/source_heartbeats.json
          if-no-files-found: warn
