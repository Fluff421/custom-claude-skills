name: Pick Engine (Signal Desk)

on:
  workflow_dispatch:
    inputs:
      live:
        description: "Write picks to Airtable (true) or dry run (false)"
        type: boolean
        default: false
      reprice:
        description: "Also re-price/withdraw stale pending auto picks (only applies when live is true)"
        type: boolean
        default: false
  pull_request:
    paths:
      - signal-desk/picks.py
      - .github/workflows/picks.yml
  schedule:
    - cron: "50 */3 * * *"

permissions:
  contents: read

jobs:
  picks:
    runs-on: ubuntu-latest
    env:
      AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
      AIRTABLE_BASE_ID: ${{ secrets.SIGNAL_DESK_BASE_ID || secrets.AIRTABLE_BASE_ID }}
      REPRICE_LIVE: ${{ ((github.event_name == 'workflow_dispatch' && inputs.reprice == true) || (github.event_name == 'schedule' && vars.REPRICE_LIVE == 'true')) && '1' || '0' }}
      PICKS_LIVE: ${{ ((github.event_name == 'workflow_dispatch' && inputs.live == true) || (github.event_name == 'schedule' && vars.PICKS_LIVE == 'true')) && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate configuration
        shell: bash
        run: |
          missing=()
          for key in AIRTABLE_TOKEN AIRTABLE_BASE_ID; do
            if [ -z "${!key}" ]; then
              missing+=("$key")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing or empty GitHub Actions secret(s): ${missing[*]}"
            exit 1
          fi
          echo "Configuration present. Mode: PICKS_LIVE=${PICKS_LIVE}"
      - name: Generate picks
        run: python signal-desk/picks.py
