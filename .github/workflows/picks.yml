name: Pick Engine (Signal Desk)

on:
  workflow_dispatch:
    inputs:
      live:
        description: "Write picks to Airtable (true) or dry run (false)"
        type: boolean
        default: false
      reprice:
        description: "Also re-price/withdraw stale pending auto picks (only applies when live is true)"
        type: boolean
        default: false
  pull_request:
    paths:
      - signal-desk/picks.py
      - signal-desk/markets.py
      - signal-desk/sigma_learning.py
      - signal-desk/clv_learning.py
      - .github/workflows/picks.yml
      - .github/workflows/signal-desk-ci.yml
  schedule:
    - cron: "47 */3 * * *"
  # Re-price after Context or the injury producer finishes, so changed QB/injury inputs
  # reach the picks without waiting for the next 3-hourly slot (GitHub often delays that slot by hours).
  workflow_run:
    workflows: ["Context & Calibrate (Signal Desk)", "NCAAF Injury Pull (Signal Desk)"]
    types: [completed]

permissions:
  contents: write   # data-only commits (markets files) to main; Airtable writes are unchanged

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('signal-desk-picks-pr-{0}', github.event.pull_request.number) || 'signal-desk-picks' }}
  cancel-in-progress: false

jobs:
  pull_request_checks:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/signal-desk-ci.yml
  picks:
    # A chained run happens only after a successful source run on main that was scheduled or dispatched
    # (never after a pull-request check or a failed run). It then behaves exactly like a scheduled run.
    if: >-
      ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_run' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main' &&
           (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch'))) }}
    runs-on: ubuntu-latest
    env:
      AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
      AIRTABLE_BASE_ID: ${{ secrets.SIGNAL_DESK_BASE_ID || secrets.AIRTABLE_BASE_ID }}
      REPRICE_LIVE: ${{ ((github.event_name == 'workflow_dispatch' && inputs.reprice == true) || ((github.event_name == 'schedule' || github.event_name == 'workflow_run') && vars.REPRICE_LIVE == 'true')) && '1' || '0' }}
      FACTOR_MODE: ${{ vars.FACTOR_MODE || 'shadow' }}
      FACTORS_SHADOW_LIVE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run') && vars.FACTORS_SHADOW_LIVE == 'true' && '1' || '0' }}
      MARKETS_LIVE: ${{ ((github.event_name == 'workflow_dispatch' && inputs.live == true) || ((github.event_name == 'schedule' || github.event_name == 'workflow_run') && vars.MARKETS_LIVE == 'true')) && '1' || '0' }}
      PICKS_LIVE: ${{ ((github.event_name == 'workflow_dispatch' && inputs.live == true) || ((github.event_name == 'schedule' || github.event_name == 'workflow_run') && vars.PICKS_LIVE == 'true')) && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate configuration
        shell: bash
        run: |
          missing=()
          for key in AIRTABLE_TOKEN AIRTABLE_BASE_ID; do
            if [ -z "${!key}" ]; then
              missing+=("$key")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing or empty GitHub Actions secret(s): ${missing[*]}"
            exit 1
          fi
          echo "Configuration present. Mode: PICKS_LIVE=${PICKS_LIVE}"
      - name: Generate picks
        run: python signal-desk/picks.py
      - name: Price every market (totals, moneylines, teasers, parlays, alternate lines) and refresh lines
        run: python signal-desk/markets.py run
      - name: Commit market pricing and line log (data only)
        if: ${{ env.MARKETS_LIVE == '1' }}
        run: bash .github/scripts/commit_data.sh "Signal Desk markets $(date -u +%F-%H%M) (auto)" signal-desk/intelligence/markets
